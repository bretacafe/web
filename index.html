<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2A1D14;
    --parchment:#F5EFE3;
    --rust:#A8452C;
    --sage:#6B7455;
    --gold:#C89B3C;
    --ink:#241813;
    --line: rgba(42,29,20,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:620px;
    margin:0 auto;
    padding:0 20px 60px;
  }
  header{
    background:var(--espresso);
    color:var(--parchment);
    padding:48px 20px 36px;
    margin-bottom: 8px;
    position:relative;
    overflow:hidden;
  }
  header .inner{
    max-width:620px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:600;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-size:38px;
    font-weight:600;
    line-height:1.05;
    margin:0 0 12px;
  }
  header p{
    margin:0;
    font-size:15px;
    color:rgba(245,239,227,0.75);
    max-width:46ch;
    line-height:1.5;
  }
  .beans{
    position:absolute;
    right:-30px;
    top:-30px;
    width:180px;
    height:180px;
    opacity:0.14;
    z-index:1;
  }
  form{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px 28px 36px;
    margin-top:-20px;
    position:relative;
    z-index:3;
    box-shadow:0 12px 30px rgba(42,29,20,0.08);
  }
  .field{
    margin-bottom:26px;
  }
  .field:last-of-type{ margin-bottom:0; }
  label.field-label{
    display:block;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--espresso);
    margin-bottom:10px;
  }
  label.field-label .opt{
    text-transform:none;
    font-weight:400;
    letter-spacing:0;
    color:#8a7d6f;
    font-size:12px;
  }
  input[type="text"], input[type="tel"], input[type="number"], textarea, select{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--parchment);
    padding:12px 14px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--rust);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:80px; }

  select{
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232A1D14' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:16px;
    padding-right:38px;
  }
  select#tipoCafe{ margin-bottom:8px; }
  .cafe-desc{
    font-size:13px;
    color:#8a7d6f;
    line-height:1.5;
    min-height:18px;
  }

  /* Grind selector — signature element */
  .grind-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(96px,1fr));
    gap:10px;
  }
  .grind-option{ position:relative; display:block; }
  .grind-option input{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    width:100%; height:100%;
    margin:0;
    padding:0;
    opacity:0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    z-index:2;
  }
  .grind-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 10px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    background:#fff;
    overflow:hidden;
    position:relative;
    z-index:1;
  }
  .grind-option input:checked + .grind-card{
    border-color:var(--rust);
    background:rgba(168,69,44,0.06);
  }
  .grind-option input:focus-visible + .grind-card{
    outline:2px solid var(--rust);
    outline-offset:2px;
  }
  .grind-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    height:30px;
    margin-bottom:8px;
  }
  .grind-icon svg{
    width:30px;
    height:30px;
    stroke:var(--sage);
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke .15s ease;
  }
  .grind-option input:checked + .grind-card .grind-icon svg{ stroke:var(--rust); }
  .grind-name{ font-size:12.5px; font-weight:500; }

  .qty-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-btn{
    width:38px;height:38px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:18px;
    cursor:pointer;
    color:var(--espresso);
    line-height:1;
  }
  .qty-btn:hover{ border-color:var(--rust); color:var(--rust); }
  input[type="number"]#cantidad{
    text-align:center;
    max-width:80px;
  }

  button.submit{
    width:100%;
    margin-top:32px;
    background:var(--rust);
    color:#fff;
    border:none;
    padding:15px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    border-radius:3px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    transition:background .15s ease;
  }
  button.submit:hover{ background:#8f3a24; }
  button.submit:disabled{ background:#c2a99e; cursor:not-allowed; }

  .status{
    margin-top:16px;
    font-size:14px;
    text-align:center;
    display:none;
  }
  .status.ok{ color:var(--sage); display:block; }
  .status.err{ color:var(--rust); display:block; }

  footer{
    text-align:center;
    font-size:12px;
    color:#9b8d7d;
    margin-top:24px;
  }
</style>
</head>
<body>
<header>
  <svg class="beans" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="30" rx="18" ry="24" fill="#F5EFE3" transform="rotate(-20 30 30)"/>
    <ellipse cx="70" cy="65" rx="18" ry="24" fill="#F5EFE3" transform="rotate(30 70 65)"/>
    <ellipse cx="70" cy="20" rx="14" ry="18" fill="#F5EFE3" transform="rotate(10 70 20)"/>
  </svg>
  <div class="inner">
    <p class="eyebrow">BRETA CAFÉ</p>
    <h1>Hacé tu pedido</h1>
    <p>Contanos qué café querés y te lo preparamos fresco. Elegí molienda, formato y cantidad — el resto lo hacemos nosotros.</p>
  </div>
</header>

<div class="wrap">
  <form id="pedidoForm">
    <div class="field">
      <label class="field-label" for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required autocomplete="name">
    </div>

    <div class="field">
      <label class="field-label" for="celular">Celular</label>
      <input type="tel" id="celular" name="celular" required autocomplete="tel" placeholder="11 1234 5678">
    </div>

    <div class="field">
      <label class="field-label" for="tipoCafe">Tipo de café</label>
      <select id="tipoCafe" name="tipoCafe" required>
        <option value="" disabled selected>Elegí un origen</option>
        <option value="Peruano" data-desc="Café suave con notas de cacao y caramelo.">Peruano — suave, notas de cacao y caramelo</option>
        <option value="Brasilero" data-desc="Café intenso, de perfil tradicional.">Brasilero — intenso, perfil tradicional</option>
      </select>
      <p class="cafe-desc" id="cafeDesc"></p>
    </div>

    <div class="field">
      <label class="field-label">Tipo de molienda</label>
      <div class="grind-grid" role="radiogroup" aria-label="Tipo de molienda">
        <label class="grind-option">
          <input type="radio" name="molienda" value="Italiana" required>
          <span class="grind-card">
            <span class="grind-icon">
              <!-- Cafetera italiana / moka pot -->
              <svg viewBox="0 0 32 32" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 20 L9 27 L23 27 L21 20 Z"/>
                <path d="M10 20 L22 20 L20 12 L12 12 Z"/>
                <path d="M13 12 L12 6 L20 6 L19 12"/>
                <line x1="10" y1="16" x2="22" y2="16"/>
                <path d="M22 15 C25 15 25 19 22 19" />
                <rect x="14" y="4" width="4" height="2.5" rx="0.5"/>
              </svg>
            </span>
            <span class="grind-name">Italiana</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Francesa">
          <span class="grind-card">
            <span class="grind-icon">
              <!-- Prensa francesa -->
              <svg viewBox="0 0 32 32" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="12" height="16" rx="1.5"/>
                <line x1="10" y1="14" x2="22" y2="14"/>
                <line x1="16" y1="4" x2="16" y2="10"/>
                <line x1="13" y1="4" x2="19" y2="4"/>
                <path d="M6 15 C6 15 8 15 8 18 C8 21 6 21 6 21" />
              </svg>
            </span>
            <span class="grind-name">Francesa</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Filtro">
          <span class="grind-card">
            <span class="grind-icon">
              <!-- Filtro / dripper -->
              <svg viewBox="0 0 32 32" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 9 L23 9 L17 22 L15 22 Z"/>
                <line x1="6" y1="9" x2="26" y2="9"/>
                <line x1="16" y1="22" x2="16" y2="27"/>
                <path d="M12 27 L20 27"/>
              </svg>
            </span>
            <span class="grind-name">Filtro</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Expresso">
          <span class="grind-card">
            <span class="grind-icon">
              <!-- Máquina de espresso / portafiltro -->
              <svg viewBox="0 0 32 32" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <rect x="9" y="6" width="14" height="8" rx="1"/>
                <line x1="14" y1="14" x2="13" y2="18"/>
                <line x1="18" y1="14" x2="19" y2="18"/>
                <path d="M11 18 L21 18 L18 22 L14 22 Z"/>
                <line x1="16" y1="22" x2="16" y2="25"/>
                <line x1="12" y1="27" x2="20" y2="27"/>
              </svg>
            </span>
            <span class="grind-name">Espresso</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Grano">
          <span class="grind-card">
            <span class="grind-icon">
              <!-- Molinillo manual -->
              <svg viewBox="0 0 32 32" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                <rect x="11" y="14" width="10" height="10" rx="1.5"/>
                <path d="M13 14 L13 10 C13 8 14 7 16 7 C18 7 19 8 19 10 L19 14"/>
                <line x1="16" y1="7" x2="16" y2="4"/>
                <line x1="13.5" y1="4" x2="18.5" y2="4"/>
                <line x1="16" y1="24" x2="16" y2="27"/>
                <path d="M9 27 L23 27"/>
              </svg>
            </span>
            <span class="grind-name">Grano entero</span>
          </span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="formato">Formato</label>
      <select id="formato" name="formato" required>
        <option value="" disabled selected>Elegí un formato</option>
        <option value="250g">Bolsa 250g</option>
        <option value="500g">Bolsa 500g</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label" for="cantidad">Cantidad</label>
      <div class="qty-row">
        <button type="button" class="qty-btn" id="qtyMinus" aria-label="Restar una unidad">−</button>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
        <button type="button" class="qty-btn" id="qtyPlus" aria-label="Sumar una unidad">+</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="direccion">Dirección de entrega <span class="opt">(opcional)</span></label>
      <input type="text" id="direccion" name="direccion" autocomplete="street-address">
    </div>

    <div class="field">
      <label class="field-label" for="comentarios">Comentarios adicionales</label>
      <textarea id="comentarios" name="comentarios" placeholder="Alguna aclaración sobre tu pedido..."></textarea>
    </div>

    <button type="submit" class="submit" id="submitBtn">Enviar pedido</button>
    <p class="status" id="statusMsg"></p>
  </form>
  <footer>¡Gracias por tu pedido!</footer>
</div>

<script>
  // ⚠️ Reemplazá esta URL por la de tu Web App de Google Apps Script
  // (la obtenés al implementar el script — ver instrucciones adjuntas)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyfszQm9Bdn_-ri4v5AE8mQ5493uUX_QwN6INanOWNiVyumxm5mX38Km7vCJ1OUpJMJ/exec";

  const tipoCafeSelect = document.getElementById('tipoCafe');
  const cafeDesc = document.getElementById('cafeDesc');
  tipoCafeSelect.addEventListener('change', () => {
    const opt = tipoCafeSelect.options[tipoCafeSelect.selectedIndex];
    cafeDesc.textContent = opt.dataset.desc || '';
  });

  const qtyInput = document.getElementById('cantidad');
  document.getElementById('qtyMinus').addEventListener('click', () => {
    qtyInput.value = Math.max(1, parseInt(qtyInput.value || '1', 10) - 1);
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    qtyInput.value = parseInt(qtyInput.value || '1', 10) + 1;
  });

  const form = document.getElementById('pedidoForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (SCRIPT_URL.includes('PEGA_ACA')) {
      statusMsg.textContent = 'Falta configurar la URL del Apps Script. Mirá las instrucciones.';
      statusMsg.className = 'status err';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    statusMsg.className = 'status';

    const data = Object.fromEntries(new FormData(form).entries());
    data.timestamp = new Date().toISOString();

    try {
      // Apps Script Web Apps no devuelven headers CORS estándar,
      // por eso se usa 'no-cors': no podemos leer la respuesta,
      // pero el POST se procesa igual del lado del script.
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      statusMsg.textContent = '¡Gracias por tu pedido! Te contactamos a la brevedad.';
      statusMsg.className = 'status ok';
      form.reset();
      qtyInput.value = 1;
    } catch (err) {
      statusMsg.textContent = 'Hubo un error al enviar el pedido. Probá de nuevo.';
      statusMsg.className = 'status err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar pedido';
    }
  });
</script>
</body>
</html>
