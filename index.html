<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2A1D14;
    --parchment:#F5EFE3;
    --rust:#A8452C;
    --sage:#6B7455;
    --gold:#C89B3C;
    --ink:#241813;
    --line: rgba(42,29,20,0.15);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:620px;
    margin:0 auto;
    padding:0 20px 60px;
  }
  header{
    background:var(--espresso);
    color:var(--parchment);
    padding:48px 20px 36px;
    margin-bottom: 8px;
    position:relative;
    overflow:hidden;
  }
  header .inner{
    max-width:620px;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
    font-weight:600;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-size:38px;
    font-weight:600;
    line-height:1.05;
    margin:0 0 12px;
  }
  header p{
    margin:0;
    font-size:15px;
    color:rgba(245,239,227,0.75);
    max-width:46ch;
    line-height:1.5;
  }
  .beans{
    position:absolute;
    right:-30px;
    top:-30px;
    width:180px;
    height:180px;
    opacity:0.14;
    z-index:1;
  }
  form{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px 28px 36px;
    margin-top:-20px;
    position:relative;
    z-index:3;
    box-shadow:0 12px 30px rgba(42,29,20,0.08);
  }
  .field{
    margin-bottom:26px;
  }
  .field:last-of-type{ margin-bottom:0; }
  label.field-label{
    display:block;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--espresso);
    margin-bottom:10px;
  }
  label.field-label .opt{
    text-transform:none;
    font-weight:400;
    letter-spacing:0;
    color:#8a7d6f;
    font-size:12px;
  }
  input[type="text"], input[type="tel"], input[type="number"], textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--parchment);
    padding:12px 14px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--rust);
    background:#fff;
  }
  textarea{ resize:vertical; min-height:80px; }

  /* Grind selector — signature element */
  .grind-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(96px,1fr));
    gap:10px;
  }
  .grind-option{ position:relative; }
  .grind-option input{
    position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;
  }
  .grind-card{
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 10px 10px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    background:#fff;
  }
  .grind-option input:checked + .grind-card{
    border-color:var(--rust);
    background:rgba(168,69,44,0.06);
  }
  .grind-option input:focus-visible + .grind-card{
    outline:2px solid var(--rust);
    outline-offset:2px;
  }
  .grind-bars{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:3px;
    height:26px;
    margin-bottom:8px;
  }
  .grind-bars span{
    width:4px;
    background:var(--sage);
    border-radius:1px;
    display:block;
  }
  .grind-option input:checked + .grind-card .grind-bars span{ background:var(--rust); }
  .grind-name{ font-size:12.5px; font-weight:500; }

  /* Formato selector */
  .formato-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .formato-option input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .formato-option{ position:relative; }
  .formato-card{
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    background:#fff;
    font-weight:500;
    font-size:14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .formato-option input:checked + .formato-card{
    border-color:var(--rust);
    background:rgba(168,69,44,0.06);
    color:var(--rust);
  }

  .qty-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-btn{
    width:38px;height:38px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:18px;
    cursor:pointer;
    color:var(--espresso);
    line-height:1;
  }
  .qty-btn:hover{ border-color:var(--rust); color:var(--rust); }
  input[type="number"]#cantidad{
    text-align:center;
    max-width:80px;
  }

  button.submit{
    width:100%;
    margin-top:32px;
    background:var(--rust);
    color:#fff;
    border:none;
    padding:15px;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    border-radius:3px;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    transition:background .15s ease;
  }
  button.submit:hover{ background:#8f3a24; }
  button.submit:disabled{ background:#c2a99e; cursor:not-allowed; }

  .status{
    margin-top:16px;
    font-size:14px;
    text-align:center;
    display:none;
  }
  .status.ok{ color:var(--sage); display:block; }
  .status.err{ color:var(--rust); display:block; }

  footer{
    text-align:center;
    font-size:12px;
    color:#9b8d7d;
    margin-top:24px;
  }
</style>
</head>
<body>
<header>
  <svg class="beans" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="30" cy="30" rx="18" ry="24" fill="#F5EFE3" transform="rotate(-20 30 30)"/>
    <ellipse cx="70" cy="65" rx="18" ry="24" fill="#F5EFE3" transform="rotate(30 70 65)"/>
    <ellipse cx="70" cy="20" rx="14" ry="18" fill="#F5EFE3" transform="rotate(10 70 20)"/>
  </svg>
  <div class="inner">
    <p class="eyebrow">Tostadora de especialidad</p>
    <h1>Hacé tu pedido</h1>
    <p>Contanos qué café querés y te lo preparamos fresco. Elegí molienda, formato y cantidad — el resto lo hacemos nosotros.</p>
  </div>
</header>

<div class="wrap">
  <form id="pedidoForm">
    <div class="field">
      <label class="field-label" for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required autocomplete="name">
    </div>

    <div class="field">
      <label class="field-label" for="celular">Celular</label>
      <input type="tel" id="celular" name="celular" required autocomplete="tel" placeholder="11 1234 5678">
    </div>

    <div class="field">
      <label class="field-label">Tipo de molienda</label>
      <div class="grind-grid" role="radiogroup" aria-label="Tipo de molienda">
        <label class="grind-option">
          <input type="radio" name="molienda" value="Italiana" required>
          <span class="grind-card">
            <span class="grind-bars"><span style="height:6px"></span><span style="height:6px"></span><span style="height:6px"></span><span style="height:6px"></span><span style="height:6px"></span></span>
            <span class="grind-name">Italiana</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Francesa">
          <span class="grind-card">
            <span class="grind-bars"><span style="height:22px"></span><span style="height:22px"></span><span style="height:22px"></span></span>
            <span class="grind-name">Francesa</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Filtro">
          <span class="grind-card">
            <span class="grind-bars"><span style="height:16px"></span><span style="height:16px"></span><span style="height:16px"></span><span style="height:16px"></span></span>
            <span class="grind-name">Filtro</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Expresso">
          <span class="grind-card">
            <span class="grind-bars"><span style="height:9px"></span><span style="height:9px"></span><span style="height:9px"></span><span style="height:9px"></span><span style="height:9px"></span></span>
            <span class="grind-name">Espresso</span>
          </span>
        </label>
        <label class="grind-option">
          <input type="radio" name="molienda" value="Grano">
          <span class="grind-card">
            <span class="grind-bars"><span style="height:26px;width:8px;border-radius:50%"></span></span>
            <span class="grind-name">Grano entero</span>
          </span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Formato</label>
      <div class="formato-grid" role="radiogroup" aria-label="Formato">
        <label class="formato-option">
          <input type="radio" name="formato" value="250g" required>
          <span class="formato-card">Bolsa 250g</span>
        </label>
        <label class="formato-option">
          <input type="radio" name="formato" value="500g">
          <span class="formato-card">Bolsa 500g</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="cantidad">Cantidad</label>
      <div class="qty-row">
        <button type="button" class="qty-btn" id="qtyMinus" aria-label="Restar una unidad">−</button>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
        <button type="button" class="qty-btn" id="qtyPlus" aria-label="Sumar una unidad">+</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="direccion">Dirección de entrega <span class="opt">(opcional)</span></label>
      <input type="text" id="direccion" name="direccion" autocomplete="street-address">
    </div>

    <div class="field">
      <label class="field-label" for="comentarios">Comentarios adicionales</label>
      <textarea id="comentarios" name="comentarios" placeholder="Alguna aclaración sobre tu pedido..."></textarea>
    </div>

    <button type="submit" class="submit" id="submitBtn">Enviar pedido</button>
    <p class="status" id="statusMsg"></p>
  </form>
  <footer>Los pedidos se cargan directamente a la planilla de seguimiento.</footer>
</div>

<script>
  // ⚠️ Reemplazá esta URL por la de tu Web App de Google Apps Script
  // (la obtenés al implementar el script — ver instrucciones adjuntas)
  const SCRIPT_URL = "PEGA_ACA_TU_URL_DE_APPS_SCRIPT";

  const qtyInput = document.getElementById('cantidad');
  document.getElementById('qtyMinus').addEventListener('click', () => {
    qtyInput.value = Math.max(1, parseInt(qtyInput.value || '1', 10) - 1);
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    qtyInput.value = parseInt(qtyInput.value || '1', 10) + 1;
  });

  const form = document.getElementById('pedidoForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (SCRIPT_URL.includes('PEGA_ACA')) {
      statusMsg.textContent = 'Falta configurar la URL del Apps Script. Mirá las instrucciones.';
      statusMsg.className = 'status err';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    statusMsg.className = 'status';

    const data = Object.fromEntries(new FormData(form).entries());
    data.timestamp = new Date().toISOString();

    try {
      // Apps Script Web Apps no devuelven headers CORS estándar,
      // por eso se usa 'no-cors': no podemos leer la respuesta,
      // pero el POST se procesa igual del lado del script.
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      statusMsg.textContent = '¡Pedido enviado! Te contactamos a la brevedad.';
      statusMsg.className = 'status ok';
      form.reset();
      qtyInput.value = 1;
    } catch (err) {
      statusMsg.textContent = 'Hubo un error al enviar el pedido. Probá de nuevo.';
      statusMsg.className = 'status err';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar pedido';
    }
  });
</script>
</body>
</html>
